name: Propose Node.js LTS Update in .nvmrc and flake.nix

on:
  schedule:
    # Runs on the 1st of every month at 06:00 UTC.
    # It will only open a PR when a NEW LTS major is available.
    - cron: '0 6 1 * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write         # To commit the change and push the branch
  pull-requests: write    # To create the pull request

jobs:
  propose-node-update:
    runs-on: ubuntu-latest
    outputs:
      latest_lts_major: ${{ steps.get_versions.outputs.latest_lts_major }}
      needs_update: ${{ steps.get_versions.outputs.needs_update }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Latest LTS and Current .nvmrc Version
        id: get_versions
        run: |
          echo "Fetching latest Node.js LTS version..."
          LATEST_LTS_VERSION=$(curl -s https://nodejs.org/dist/index.json | jq -r '[.[] | select(.lts != false)] | sort_by(.date) | reverse | .[0].version')
          LATEST_LTS_MAJOR=$(echo "$LATEST_LTS_VERSION" | sed 's/v\([0-9]*\).*/\1/')
          echo "Latest LTS Major: ${LATEST_LTS_MAJOR}"

          if [[ ! -f ".nvmrc" ]]; then
            echo "Error: .nvmrc file not found."
            exit 1
          fi

          CURRENT_RAW_VERSION=$(cat .nvmrc | xargs)
          CURRENT_MAJOR=$(echo "$CURRENT_RAW_VERSION" | sed 's/^v\?//')
          echo "Current Configured Major in .nvmrc: ${CURRENT_MAJOR}"

          if ! [[ "$LATEST_LTS_MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$CURRENT_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not parse valid major version numbers."
            exit 1
          fi

          echo "latest_lts_major=${LATEST_LTS_MAJOR}" >> "$GITHUB_OUTPUT"

          if [[ "$LATEST_LTS_MAJOR" -gt "$CURRENT_MAJOR" ]]; then
            echo "New LTS major detected — a PR will be opened."
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Node.js major version update needed."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Update .nvmrc
        if: steps.get_versions.outputs.needs_update == 'true'
        run: |
          LATEST_LTS_MAJOR="${{ steps.get_versions.outputs.latest_lts_major }}"
          echo "${LATEST_LTS_MAJOR}" > .nvmrc
          echo ".nvmrc now:"
          cat .nvmrc
        shell: bash

      - name: Update flake.nix nodejs attribute
        if: steps.get_versions.outputs.needs_update == 'true'
        run: |
          LATEST_LTS_MAJOR="${{ steps.get_versions.outputs.latest_lts_major }}"

          if [[ ! -f "flake.nix" ]]; then
            echo "No flake.nix found — skipping."
            exit 0
          fi

          if grep -qE 'pkgs\.nodejs_[0-9]+' flake.nix; then
            sed -i -E "s/pkgs\.nodejs_[0-9]+/pkgs.nodejs_${LATEST_LTS_MAJOR}/g" flake.nix
            echo "flake.nix updated to nodejs_${LATEST_LTS_MAJOR}:"
            grep -n 'nodejs_' flake.nix || true
          elif grep -qE 'pkgs\.nodejs([^_]|$)' flake.nix; then
            echo "flake.nix uses rolling 'pkgs.nodejs' (latest LTS in nixpkgs) — no attribute change needed."
          else
            echo "WARNING: no nodejs reference found in flake.nix — check manually."
          fi
        shell: bash

      - name: Create Pull Request for yearly LTS bump
        if: steps.get_versions.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(node): update to Node.js LTS v${{ steps.get_versions.outputs.latest_lts_major }}"
          committer: GitHub Actions Bot <actions@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: chore/update-node-v${{ steps.get_versions.outputs.latest_lts_major }}
          delete-branch: true
          title: "chore(node): update to Node.js LTS v${{ steps.get_versions.outputs.latest_lts_major }}"
          body: |
            The latest Node.js LTS is **v${{ steps.get_versions.outputs.latest_lts_major }}**.

            This PR updates:
            - `.nvmrc` → `${{ steps.get_versions.outputs.latest_lts_major }}`
            - `flake.nix` → `pkgs.nodejs_${{ steps.get_versions.outputs.latest_lts_major }}` (when a specific major is pinned)

            **Before merging (one-time per year):**
            1. Optionally run `nix flake update` locally, or wait for the next monthly *Update flake.lock* run.
            2. Run `nix develop` and confirm `node --version` matches v${{ steps.get_versions.outputs.latest_lts_major }}.
            3. Run `npm install` (or `npm ci`) to refresh the lockfile.
            4. Run `npm run build` (and `npm test` if present).
            5. Merge once green.